<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>May Archive</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#profile" aria-label="May Archive">May Archive</a>
    <nav class="tabs" aria-label="Sections">
      <button class="tab active" data-view="profile" id="tabProfile">プロフィール</button>
      <button class="tab" data-view="twitter" id="tabTwitter">X アーカイブ</button>
    </nav>
    <div class="lang-switch" aria-label="Language">
      <button data-lang="ja" class="active">日本語</button>
      <button data-lang="ko">한국어</button>
    </div>
  </header>

  <main>
    <section id="profileView" class="view"></section>
    <section id="twitterView" class="view hidden">
      <div class="archive-tools">
        <div>
          <h1 id="archiveTitle">X アーカイブ</h1>
          <p id="archiveLead" class="muted">@May_o_o_T の投稿を時系列で保存したアーカイブ</p>
        </div>
        <div class="tool-row">
          <span id="count" class="count"></span>
          <input id="q" type="search" autocomplete="off" placeholder="投稿を検索">
        </div>
      </div>
      <div id="feed"></div>
    </section>
  </main>

  <footer>
    <span id="footerText">非公式アーカイブ。権利は各権利者に帰属します。</span>
  </footer>
  <script src="app.js"></script>
</body>
</html>
