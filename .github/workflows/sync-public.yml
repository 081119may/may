name: Sync profile and upcoming events

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/sync_public.py'
      - '.github/workflows/sync-public.yml'
  schedule:
    - cron: '47 0 * * *'

permissions:
  contents: write

concurrency:
  group: may-public-data
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message || '', 'Sync profile and upcoming events') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install parser and browser
        run: |
          pip install beautifulsoup4 playwright
          python -m playwright install --with-deps chromium
      - name: Refresh expanded Amuse profile and Eventernote-backed schedule
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_TRANSLATE_MODEL: gpt-5-mini
        run: python scripts/sync_public.py
      - name: Commit refreshed public data
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add profile.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Sync profile and upcoming events'
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Push failed after rebasing against concurrent main updates."
              exit 1
            fi
            echo "::warning::Remote main moved during push; rebasing and retrying ($attempt/3)."
            git pull --rebase origin main
          done
