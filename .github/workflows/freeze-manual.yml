name: One-time manual translation audit

on:
  push:
    branches: [manual-translation-cleanup]
    paths:
      - 'scripts/freeze_manual_translations.py'
      - 'scripts/fix_manual_datewars.py'
      - 'scripts/audit_x_translations.py'
      - '.github/workflows/freeze-manual.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: may-manual-translation-audit
  cancel-in-progress: false

jobs:
  audit:
    if: ${{ !contains(github.event.head_commit.message || '', 'Freeze X translations for manual audit') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: manual-translation-cleanup
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/freeze_manual_translations.py
      - run: python scripts/fix_manual_datewars.py
      - run: python scripts/audit_x_translations.py
      - name: Commit frozen review data
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/manual-translations.json data/manual-missing.json data/translation-audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Freeze X translations for manual audit'
          git push origin HEAD:manual-translation-cleanup
