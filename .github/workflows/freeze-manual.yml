name: Freeze manual translations

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/freeze_manual_translations.py'
      - '.github/workflows/freeze-manual.yml'

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/freeze_manual_translations.py
      - name: Commit frozen manual translations
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/manual-translations.json data/manual-missing.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Freeze current X translations for manual review'
          git push
