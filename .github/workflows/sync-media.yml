name: Sync X media

on:
  push:
    branches: [main]
    paths:
      - 'data/tweet_ids.txt'
      - '.github/workflows/sync-media.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write

concurrency:
  group: may-media-sync
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message || '', 'Sync X media assets') }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download missing media
        env:
          X_USERNAME: May_o_o_T
        run: |
          python - <<'PY'
          import json, os, pathlib, time, urllib.request
          root=pathlib.Path('.')
          out=root/'media_remote';out.mkdir(exist_ok=True)
          username=os.getenv('X_USERNAME','May_o_o_T')
          ids=[x.strip() for x in (root/'data/tweet_ids.txt').read_text().splitlines() if x.strip()]
          map_path=root/'data/media-map.json';checked_path=root/'data/media-checked.json'
          try: media_map=json.loads(map_path.read_text())
          except Exception: media_map={}
          try: checked=set(json.loads(checked_path.read_text()))
          except Exception: checked=set()
          headers={'User-Agent':'Mozilla/5.0 MayArchive/3.0','Accept':'application/json'}
          def get_json(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
          def download(url,path):
              if path.exists() and path.stat().st_size>1000:return True
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=90) as r,open(path,'wb') as f:
                  while True:
                      b=r.read(1024*1024)
                      if not b:break
                      f.write(b)
              return path.exists() and path.stat().st_size>1000
          def media_url(m):
              typ=(m.get('type') or '').lower()
              if typ=='photo': return m.get('url'),'.jpg'
              formats=[f for f in (m.get('formats') or []) if f.get('url') and (f.get('container')=='mp4' or '.mp4' in f.get('url','').split('?')[0].lower())]
              if formats:
                  formats.sort(key=lambda f:f.get('bitrate') or f.get('size') or 0,reverse=True)
                  return formats[0]['url'],'.mp4'
              u=m.get('transcode_url') or m.get('url') or m.get('thumbnail_url')
              if not u:return None,None
              return u,('.mp4' if typ in ('video','gif') and '.mp4' in u.lower() else '.jpg')
          targets=[tid for tid in ids if tid not in checked]
          print('unchecked posts',len(targets),'of',len(ids))
          for n,tid in enumerate(targets,1):
              ok=False
              try:
                  # Legacy status endpoint requires the username in the URL.
                  data=get_json(f'https://api.fxtwitter.com/{username}/status/{tid}')
                  tweet=data.get('tweet') or {}
                  allm=((tweet.get('media') or {}).get('all') or [])
                  paths=[]
                  for i,m in enumerate(allm,1):
                      url,ext=media_url(m)
                      if not url:continue
                      rel=f'media_remote/{tid}_{i}{ext}';p=root/rel
                      if download(url,p):paths.append(rel)
                  if paths:media_map[tid]=paths
                  ok=True
              except Exception as e:print('WARN',tid,repr(e))
              if ok:checked.add(tid)
              if n%20==0:time.sleep(1)
          map_path.write_text(json.dumps(media_map,ensure_ascii=False,separators=(',',':')))
          checked_path.write_text(json.dumps(sorted(checked),ensure_ascii=False,separators=(',',':')))
          print('posts with media',len(media_map),'files',sum(map(len,media_map.values())),'checked',len(checked))
          PY
      - name: Commit media
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add media_remote data/media-map.json data/media-checked.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Sync X media assets'
          git push
