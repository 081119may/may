name: Sync official voice samples

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-voice.yml'
      - 'data/voice-transcripts.json'
  schedule:
    - cron: '11 2 * * 0'

permissions:
  contents: write

concurrency:
  group: may-voice-sync
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message || '', 'Sync official voice samples and transcripts') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch official Amuse voice files
        run: |
          python - <<'PY'
          import html,pathlib,re,urllib.parse,urllib.request,json
          base='https://www.amuse.co.jp/artist/A9019/'
          headers={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131 Safari/537.36'}
          def fetch(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r:return r.read(),r.headers.get_content_type()
          raw,_=fetch(base);text=raw.decode('utf-8','ignore');candidates=[]
          def add(u):
              u=urllib.parse.urljoin(base,html.unescape(u).replace('\\/','/'))
              if u not in candidates:candidates.append(u)
          for pat in [r'''(?:src|href|data-src|data-file|data-audio)\s*=\s*["']([^"']+\.(?:mp3|m4a|ogg|wav)(?:\?[^"']*)?)["']''',r'''(https?://[^"'<> ]+\.(?:mp3|m4a|ogg|wav)(?:\?[^"'<> ]*)?)''']:
              for m in re.finditer(pat,text,re.I):add(m.group(1))
          for m in re.finditer(r'''<script[^>]+src=["']([^"']+)["']''',text,re.I):
              try:
                  b,_=fetch(urllib.parse.urljoin(base,html.unescape(m.group(1))));t=b.decode('utf-8','ignore')
                  for q in re.finditer(r'''(["'])([^"']+\.(?:mp3|m4a|ogg|wav)(?:\?[^"']*)?)\1''',t,re.I):add(q.group(2))
              except Exception as e:print('script warn',e)
          if len(candidates)<6:raise SystemExit(f'Could not discover six official voice files: {len(candidates)}')
          out=pathlib.Path('audio');out.mkdir(exist_ok=True);names=['voice_sample_1','voice_sample_2','voice_sample_3','voice_sample_4','voice_sample_5','narration'];saved=[]
          for name,u in zip(names,candidates[:6]):
              data,ctype=fetch(u);ext='.mp3' if ('mpeg' in ctype or '.mp3' in u.lower()) else ('.m4a' if '.m4a' in u.lower() else '.ogg')
              p=out/(name+ext);p.write_bytes(data)
              if p.stat().st_size<10000:raise SystemExit(f'bad audio {u} {p.stat().st_size}')
              saved.append((name,str(p)))
          pathlib.Path('data/voice-map.json').write_text(json.dumps(dict(saved),ensure_ascii=False,separators=(',',':')))
          PY
      - name: Install local speech recognizer
        run: python -m pip install --disable-pip-version-check faster-whisper==1.1.1
      - name: Transcribe Japanese locally
        run: |
          python - <<'PY'
          import json,pathlib
          from faster_whisper import WhisperModel
          mp=json.loads(pathlib.Path('data/voice-map.json').read_text())
          try: out=json.loads(pathlib.Path('data/voice-transcripts.json').read_text())
          except Exception: out={}
          model=WhisperModel('base',device='cpu',compute_type='int8')
          for ident,path in mp.items():
              row=out.get(ident) if isinstance(out.get(ident),dict) else {}
              if row.get('ja'):
                  continue
              segments,_=model.transcribe(path,language='ja',vad_filter=True,beam_size=5)
              ja=''.join(s.text for s in segments).strip()
              out[ident]={'ja':ja,'ko':row.get('ko','')}
              print(ident,ja)
          pathlib.Path('data/voice-transcripts.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Translate transcripts to Korean when OpenAI secret is available
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python - <<'PY'
          import json,os,pathlib,urllib.request
          key=os.getenv('OPENAI_API_KEY','').strip()
          p=pathlib.Path('data/voice-transcripts.json')
          out=json.loads(p.read_text())
          if not key:
              print('OPENAI_API_KEY missing; Japanese transcripts are still retained.')
              raise SystemExit(0)
          def translate(text):
              body=json.dumps({'model':'gpt-5-mini','store':False,'input':[{'role':'developer','content':'일본어 음성 대본을 자연스러운 한국어로 번역하세요. 설명 없이 번역문만 출력하세요.'},{'role':'user','content':text}]},ensure_ascii=False).encode()
              req=urllib.request.Request('https://api.openai.com/v1/responses',data=body,headers={'Authorization':f'Bearer {key}','Content-Type':'application/json'},method='POST')
              with urllib.request.urlopen(req,timeout=90) as r:data=json.load(r)
              texts=[]
              for item in data.get('output',[]):
                  for c in item.get('content',[]):
                      if c.get('type') in ('output_text','text') and c.get('text'):texts.append(c['text'])
              return '\n'.join(texts).strip()
          changed=False
          for ident,row in out.items():
              if row.get('ja') and not row.get('ko'):
                  row['ko']=translate(row['ja']);changed=True
          if changed:p.write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Commit voice files and transcripts
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add audio data/voice-map.json data/voice-transcripts.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Sync official voice samples and transcripts'
          git push
