name: Sync official voice samples

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-voice.yml'
      - 'audio/**'
      - 'data/voice-map.json'
  schedule:
    - cron: '11 2 * * 0'

permissions:
  contents: write

concurrency:
  group: may-voice-sync
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message || '', 'Sync official voice samples and transcripts') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline transcription and translation helpers
        run: python -m pip install --disable-pip-version-check faster-whisper==1.1.1 deep-translator==1.11.4
      - name: Generate Japanese transcripts and Korean translations
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, pathlib, time, urllib.request
          from faster_whisper import WhisperModel
          from deep_translator import GoogleTranslator

          root = pathlib.Path('.')
          voice_map = json.loads((root/'data/voice-map.json').read_text('utf-8'))
          out_path = root/'data/voice-transcripts.json'
          try:
              out = json.loads(out_path.read_text('utf-8'))
          except Exception:
              out = {}

          expected = ['voice_sample_1','voice_sample_2','voice_sample_3','voice_sample_4','voice_sample_5','narration']
          missing = [k for k in expected if k not in voice_map or not pathlib.Path(voice_map[k]).exists()]
          if missing:
              raise SystemExit(f'missing voice files: {missing}')

          model = WhisperModel('base', device='cpu', compute_type='int8')

          def transcribe(path):
              segments, _ = model.transcribe(
                  str(path), language='ja', vad_filter=True, beam_size=5,
                  condition_on_previous_text=False
              )
              return ''.join(s.text for s in segments).strip()

          def openai_translate(text, key):
              body = json.dumps({
                  'model':'gpt-5-mini','store':False,
                  'input':[
                      {'role':'developer','content':'일본어 음성 대본을 자연스러운 한국어로 정확히 번역하세요. 설명 없이 번역문만 출력하세요.'},
                      {'role':'user','content':text}
                  ]
              }, ensure_ascii=False).encode('utf-8')
              req = urllib.request.Request(
                  'https://api.openai.com/v1/responses', data=body,
                  headers={'Authorization':f'Bearer {key}','Content-Type':'application/json'}, method='POST'
              )
              with urllib.request.urlopen(req, timeout=120) as r:
                  data = json.load(r)
              texts=[]
              for item in data.get('output',[]):
                  for c in item.get('content',[]):
                      if c.get('type') in ('output_text','text') and c.get('text'):
                          texts.append(c['text'])
              return '\n'.join(texts).strip()

          def translate(text):
              key = os.getenv('OPENAI_API_KEY','').strip()
              if key:
                  try:
                      v = openai_translate(text, key)
                      if v: return v
                  except Exception as e:
                      print('OpenAI translation fallback:', repr(e))
              last = None
              for attempt in range(3):
                  try:
                      v = GoogleTranslator(source='ja', target='ko').translate(text)
                      if v: return v.strip()
                  except Exception as e:
                      last = e
                      print('Google translation retry', attempt+1, repr(e))
                      time.sleep(2 + attempt*2)
              raise RuntimeError(f'Korean translation failed: {last!r}')

          complete = {}
          for ident in expected:
              row = out.get(ident) if isinstance(out.get(ident), dict) else {}
              ja = (row.get('ja') or '').strip()
              ko = (row.get('ko') or '').strip()
              if not ja:
                  ja = transcribe(voice_map[ident])
              if not ja:
                  raise RuntimeError(f'empty Japanese transcript: {ident}')
              if not ko:
                  ko = translate(ja)
              if not ko:
                  raise RuntimeError(f'empty Korean translation: {ident}')
              complete[ident] = {'ja':ja, 'ko':ko}
              print(ident, 'JA:', ja)
              print(ident, 'KO:', ko)

          if set(complete) != set(expected):
              raise RuntimeError('voice transcript set incomplete')
          out_path.write_text(json.dumps(complete, ensure_ascii=False, indent=2)+'\n', 'utf-8')
          PY
      - name: Verify all six transcript entries
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data/voice-transcripts.json',encoding='utf-8'))
          expected={'voice_sample_1','voice_sample_2','voice_sample_3','voice_sample_4','voice_sample_5','narration'}
          assert set(d)==expected, (set(d), expected)
          assert all((d[k].get('ja') or '').strip() and (d[k].get('ko') or '').strip() for k in expected)
          print('verified', len(d), 'voice transcript entries')
          PY
      - name: Commit generated voice transcript data
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/voice-transcripts.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Sync official voice samples and transcripts'
          git push
