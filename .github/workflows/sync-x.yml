name: Check X for new posts

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/sync_x.py'
      - '.github/workflows/sync-x.yml'
      - 'data/translation-glossary.json'
  schedule:
    - cron: '23 * * * *'

permissions:
  contents: write

concurrency:
  group: may-x-backup
  cancel-in-progress: false

jobs:
  backup:
    if: ${{ !contains(github.event.head_commit.message || '', 'Auto backup X archive') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check, archive, and translate X posts
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_TRANSLATE_MODEL: gpt-5-mini
        run: python scripts/sync_x.py
      - name: Commit new X captures and translations
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/archive-auto.b64 data/manifest.json data/x-translation-pending.json data/auto-translations.json media_remote 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Auto backup X archive'
          git push
