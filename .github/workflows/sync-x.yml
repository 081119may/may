name: Auto backup X archive

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/sync_x.py'
      - '.github/workflows/sync-x.yml'
  schedule:
    - cron: '23 */6 * * *'

permissions:
  contents: write

concurrency:
  group: may-x-backup
  cancel-in-progress: false

jobs:
  backup:
    if: ${{ !contains(github.event.head_commit.message || '', 'Auto backup X archive') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch new X posts, media, and Korean translations
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          X_USERNAME: May_o_o_T
          OPENAI_TRANSLATE_MODEL: gpt-5-mini
        run: python scripts/sync_x.py
      - name: Commit backup updates
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data media_remote 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Auto backup X archive'
          git push
