name: Auto backup X archive

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/sync_x.py'
      - 'data/translation-glossary.json'
      - '.github/workflows/sync-x.yml'
  schedule:
    - cron: '23 */6 * * *'

permissions:
  contents: write

concurrency:
  group: may-x-backup
  cancel-in-progress: false

jobs:
  backup:
    if: ${{ !contains(github.event.head_commit.message || '', 'Auto backup X archive') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch new X posts, media, and Korean translations
        id: sync
        continue-on-error: true
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          X_USERNAME: May_o_o_T
          OPENAI_TRANSLATE_MODEL: gpt-5-mini
        run: python scripts/sync_x.py
      - name: Record public timeline diagnostic
        if: always()
        env:
          X_USERNAME: May_o_o_T
          SYNC_OUTCOME: ${{ steps.sync.outcome }}
        run: |
          python - <<'PY'
          import datetime as dt, json, os, pathlib, urllib.parse, urllib.request
          username=os.getenv('X_USERNAME','May_o_o_T')
          out={'checked_at':dt.datetime.now(dt.timezone.utc).isoformat(),'sync_step':os.getenv('SYNC_OUTCOME','unknown')}
          try:
              u=f'https://api.fxtwitter.com/2/profile/{urllib.parse.quote(username)}/statuses?count=20'
              req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0 MayArchive/3.2','Accept':'application/json'})
              with urllib.request.urlopen(req,timeout=45) as r:data=json.load(r)
              results=data.get('results') or []
              out.update({'http_code':data.get('code'),'result_count':len(results),'newest':({'id':results[0].get('id'),'created_at':results[0].get('created_at'),'text':(results[0].get('text') or '')[:300]} if results else None),'cursor':data.get('cursor')})
          except Exception as e:
              out['error']=repr(e)
          pathlib.Path('data/x-sync-status.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(out,ensure_ascii=False))
          PY
      - name: Commit backup updates
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data media_remote 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Auto backup X archive'
          git push
